name: Build plugin

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0e74e-weghweqthweth
    paths:
      - .github/workflows/build-plugin.yml
      - pom.xml
      - src/**
      - schem/**

permissions:
  contents: write

jobs:
  package:
    name: Package ElytrixItem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress -DskipTests clean package

      - name: Publish JAR in this branch
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/ElytrixItem.jar artifacts/ElytrixItem.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/ElytrixItem.jar
          if git diff --cached --quiet; then
            echo "JAR is already up to date."
          else
            git commit -m "Publish ElytrixItem JAR"
            git push
          fi

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ElytrixItem
          path: artifacts/ElytrixItem.jar
          if-no-files-found: error
          retention-days: 14
